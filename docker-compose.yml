version: '3.8'

services:
  # ----------------------------------------------------------------------
  # a. Frontend (Client-side): Simulated User Dashboard
  # ----------------------------------------------------------------------
  # - Frameworks/Libraries: React.js (JavaScript library for building user interfaces)
  #   - Dependencies: react, react-dom, react-scripts
  # - CSS/Preprocessors: Tailwind CSS or Material UI (for UI components)
  # - Package Managers: npm or yarn
  frontend:
    image: node:18-alpine
    container_name: jpl-frontend
    working_dir: /app
    # Expected to run a React development server
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development

  # ----------------------------------------------------------------------
  # b. Backend (Server-side): Simulated API Service
  # ----------------------------------------------------------------------
  # - Frameworks/Libraries: Node.js with Express.js
  #   - Dependencies: express, cors, pg (postgres client)
  # - Package Managers: npm or yarn
  backend:
    image: node:18-alpine
    container_name: jpl-backend
    working_dir: /app
    # Expected to run an Express server
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=jpl_lunar_db
    depends_on:
      - db

  # ----------------------------------------------------------------------
  # c. Detection Service: Simulated Computer Vision Pipeline
  # ----------------------------------------------------------------------
  # - Frameworks/Libraries: Python 3 with Flask/FastAPI, OpenCV, NumPy
  #   - Dependencies: flask, opencv-python, numpy
  # - Package Managers: pip
  detection-service:
    image: python:3.10-slim
    container_name: jpl-detection-service
    working_dir: /app
    # Expected to run a Python mock computer vision service
    command: python app.py
    ports:
      - "8000:8000"
    volumes:
      - ./detection:/app

  # ----------------------------------------------------------------------
  # d. Database: Data Storage
  # ----------------------------------------------------------------------
  # - Relational Database: PostgreSQL
  # - Purpose: Stores mock image metadata and detection data
  db:
    image: postgres:15-alpine
    container_name: jpl-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jpl_lunar_db
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  # Persistent volume for PostgreSQL data
  db-data:
