version: '3.9'

services:
  backend:
    image: node:18
    container_name: lunar-backend
    working_dir: /server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://admin:password@database:5432/lunar_detection
    depends_on:
      - database
    command: npm run dev

  detection-service:
    image: python:3.11
    container_name: lunar-detection-service
    working_dir: /detection
    command: python app.py

  database:
    image: postgres:15
    container_name: lunar-database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lunar_detection
    ports:
      - "5432:5432"
